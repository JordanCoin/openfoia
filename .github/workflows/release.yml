name: Release

# Merging a `release/X.Y.Z` branch into main publishes GitHub release vX.Y.Z,
# tagged on the merge commit, with notes taken from CHANGELOG.md.
# The full procedure is in docs/RELEASING.md.
#
# Branch names are attacker-influenced text, so they reach shell steps only
# through environment variables -- never interpolated into `run:` -- and
# scripts/release.py accepts nothing but release/X.Y.Z shapes.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names
# the release it was taken from), no checkout leaves a token in .git/config,
# and the only job holding `contents: write` installs nothing from PyPI. The
# project's dependencies and test suite run in `verify`, which can only read.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version already on main to publish (e.g. 4.3.0). Only for recovering
          a release whose automatic run failed after merge.
        required: true

permissions:
  contents: read

jobs:
  # Runs on the open release PR, against the would-be merge result, so a
  # version mismatch or a missing changelog entry is red CI before merge
  # rather than a failed release after it.
  check:
    name: Release check
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Branch, versions and changelog agree
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version=$(python scripts/release.py --branch "$BRANCH" --notes-out notes.md)

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null
          rc=$?
          set -e
          case $rc in
            0) echo "::error::Tag v$version already exists. Bump the version."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not check for an existing v$version tag (git exit $rc)."; exit 1 ;;
          esac

          {
            echo "## Release notes preview: v$version"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  # After the merge: the release is gated on the exact commit being tagged,
  # with the same checks as ci.yml -- not on the release branch's pre-merge
  # state. This is the job that installs the project and its dependencies, so
  # it gets a read-only token.
  verify:
    name: Verify release commit
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action == 'closed'
        && github.event.pull_request.merged == true
        && startsWith(github.event.pull_request.head.ref, 'release/')
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit the release PR actually put on main (merge, squash or
          # rebase alike). For a manual run, main's current head.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve version and notes
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$BRANCH" ]; then
            version=$(python scripts/release.py --branch "$BRANCH" --notes-out notes.md)
          else
            version=$(python scripts/release.py --version "$INPUT_VERSION" --notes-out notes.md)
          fi

          # Never overwrite or re-point a published tag.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null
          rc=$?
          set -e
          case $rc in
            0) echo "::error::Tag v$version already exists; refusing to re-publish it."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not check for an existing v$version tag (git exit $rc)."; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check openfoia/ tests/ scripts/

      - name: Format check
        run: ruff format --check openfoia/ tests/ scripts/

      - name: Tests
        run: python -m pytest tests/ -v -k "not gliner and not spacy and not LLM and not benchmark"

  # Tags and publishes the commit `verify` tested. It runs only the stdlib
  # scripts/release.py and the preinstalled gh CLI: nothing is installed, so a
  # compromised dependency never runs next to the write token.
  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-check version and notes on the verified commit
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          if [ -n "$BRANCH" ]; then
            version=$(python scripts/release.py --branch "$BRANCH" --notes-out notes.md)
          else
            version=$(python scripts/release.py --version "$INPUT_VERSION" --notes-out notes.md)
          fi
          sha=$(git rev-parse HEAD)
          if [ "$version" != "$VERIFIED_VERSION" ] || [ "$sha" != "$VERIFIED_SHA" ]; then
            echo "::error::Checked out v$version at $sha, but verify tested v$VERIFIED_VERSION at $VERIFIED_SHA."
            exit 1
          fi

          # Checked again right before tagging: never overwrite or re-point a
          # published tag.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null
          rc=$?
          set -e
          case $rc in
            0) echo "::error::Tag v$version already exists; refusing to re-publish it."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not check for an existing v$version tag (git exit $rc)."; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "OpenFOIA v$VERSION" \
            --notes-file notes.md
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      # The pdf-extract engine is built by the glyph-api pipeline, which
      # attaches it to the newest OpenFOIA release only when the engine
      # changes. Carry the current binaries forward so every release ships
      # them: copy from the newest earlier release that has them, verify each
      # checksum, and repeat its "pdf-extract X" notes line.
      - name: Carry the pdf-extract engine forward
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          src=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq \
            "[.[] | select(.tag_name != \"v$VERSION\") | select([.assets[].name | startswith(\"pdf-extract-\")] | any)][0].tag_name // empty")
          if [ -z "$src" ]; then
            echo "::warning::No earlier release carries pdf-extract binaries; v$VERSION ships without them."
            exit 0
          fi
          mkdir engine
          gh release download "$src" --repo "$GITHUB_REPOSITORY" --pattern 'pdf-extract-*' --dir engine
          # tr: engine 0.8.0's Windows .sha256 was written with CRLF.
          (cd engine && for f in *.sha256; do tr -d '\r' < "$f" | sha256sum -c -; done)
          gh release upload "v$VERSION" engine/pdf-extract-* --repo "$GITHUB_REPOSITORY" --clobber
          line=$(gh release view "$src" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -m1 '^pdf-extract ' || true)
          if [ -n "$line" ]; then
            printf '\n%s\n' "$line" >> notes.md
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          echo "Carried pdf-extract from $src (${line:-version not stated})" >> "$GITHUB_STEP_SUMMARY"
