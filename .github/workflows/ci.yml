name: CI

on:
  push:
    branches: [main]
  # Run on every pull request, not just those targeting main. Restricting
  # this to `branches: [main]` meant a stacked PR (one branch based on
  # another) got no test run at all — it looked reviewed and green when
  # nothing had actually executed.
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check openfoia/ tests/ scripts/

      - name: Format check
        run: ruff format --check openfoia/ tests/ scripts/

      - name: Type check
        run: mypy openfoia/ --ignore-missing-imports
        continue-on-error: true

      - name: Tests
        run: python -m pytest tests/ -v -k "not gliner and not spacy and not LLM and not benchmark"

  # The at-rest encryption and duress features are the highest-stakes code in
  # the project, and their tests skip when no SQLCipher driver is present.
  # This job installs one so those paths are actually exercised on every push
  # rather than depending on someone testing by hand.
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with encryption)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,encryption]"

      - name: Verify a SQLCipher driver is actually present
        # Fail loudly rather than letting the crypto tests silently skip,
        # which would look green while testing nothing.
        run: |
          python - <<'PY'
          import sys
          from openfoia.db import has_sqlcipher, sqlcipher_driver_name
          if not has_sqlcipher():
              sys.exit("No SQLCipher driver installed - crypto tests would silently skip.")
          print(f"SQLCipher driver: {sqlcipher_driver_name()}")
          PY

      - name: Encryption / duress integration tests
        run: python -m pytest tests/test_crypto_integration.py -v

      - name: Full suite with encryption enabled
        run: python -m pytest tests/ -v -k "not gliner and not spacy and not LLM and not benchmark"

  # The graph page only means something once a browser draws it. These tests
  # skip without Playwright and Chromium, so this job installs both, uses the
  # runner's own Chrome (no browser download), and fails if any test skips
  # rather than looking green while testing nothing.
  graph-rendered:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # fonts-droid-fallback (~2 MB) covers the CJK labels; fonts-noto-cjk was
      # 61 MB and took over 17 minutes from a slow runner mirror. A stuck mirror
      # now fails this step quickly instead of holding the job.
      - name: Install fonts for the Arabic, Hebrew and CJK label checks
        timeout-minutes: 8
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q -o Acquire::Retries=3 fonts-dejavu-core fonts-droid-fallback

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright

      - name: Rendered graph tests
        env:
          OPENFOIA_TEST_CHROMIUM: /usr/bin/google-chrome
        run: |
          test -x "$OPENFOIA_TEST_CHROMIUM" || { echo "::error::No Chrome at $OPENFOIA_TEST_CHROMIUM"; exit 1; }
          "$OPENFOIA_TEST_CHROMIUM" --version
          set -o pipefail  # a failing pytest must not hide behind tee
          python -m pytest tests/test_graph_rendered.py -v -rs | tee rendered.log
          if grep -q "SKIPPED" rendered.log; then
            echo "::error::Rendered graph tests skipped; they must run in this job."
            exit 1
          fi

      # `browse --tor` against a fake SOCKS5 proxy, with the same real Chrome:
      # the page must load and the CONNECT must carry the hostname.
      - name: Tor browse reaches a SOCKS5 proxy
        env:
          OPENFOIA_TEST_CHROMIUM: /usr/bin/google-chrome
        run: |
          set -o pipefail  # a failing pytest must not hide behind tee
          python -m pytest tests/test_security_webui_config.py -v -rs -k "tor_browse_sends_hostnames" | tee socks.log
          if grep -q "SKIPPED" socks.log; then
            echo "::error::The SOCKS5 browse test skipped; it must run in this job."
            exit 1
          fi
