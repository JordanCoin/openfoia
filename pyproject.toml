[project]
name = "openfoia"
version = "5.1.0"
description = "Local-first investigation toolkit for journalists, researchers, and citizens"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.11"
dependencies = [
    # Core — always needed, pure Python or lightweight
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
# OCR — requires system packages: tesseract-ocr, poppler-utils
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    # Also strips image metadata (EXIF) on ingest; pytesseract needs it anyway.
    "pillow>=10.0.0",
]
# Delivery gateways. Twilio and Lob are called over their REST APIs with the
# core httpx (through openfoia.net, so Tor mode applies), not their SDKs, which
# make their own connections outside it. In Tor mode both also need the tor
# extra (socksio); without it they refuse to send. SMTP over Tor needs nothing.
fax = ["reportlab>=4.0.0"]  # the fax PDF; a bare fallback PDF is used without it
mail = []
# Cloud AI providers
cloud-ai = ["anthropic>=0.18.0", "openai>=1.10.0"]
# Local NER models
ner = ["gliner>=0.2.0"]
# Multilingual NER (entities.ner_model = "multilingual"): GLiNER2 with its
# local torch runtime. Does not depend on gliner. docs/benchmarks/gliner2.md
ner-multilingual = ["gliner2[local]>=2.1,<3"]
ner-spacy = ["spacy>=3.7.0"]
# Tor routing
tor = ["socksio>=1.0.0"]
# Browser automation
browser = ["playwright>=1.40.0"]
# Outlook MSG email files
email-files = ["extract-msg>=0.48.0"]
# DocumentCloud integration
documentcloud = ["documentcloud>=4.0.0"]
# Encrypted database.
# sqlcipher3-binary ships prebuilt wheels; pysqlcipher3 is unmaintained
# (2021), source-only, and no longer pip-installs on modern Python — which
# made the encryption feature effectively unreachable. Both drivers are
# supported at runtime, so an existing pysqlcipher3 install keeps working.
encryption = ["sqlcipher3-binary>=0.5.0"]
# Offline semantic search (docs grep --semantic). model2vec: static embeddings,
# CPU only, pulls numpy + tokenizers (~90MB installed). sqlite-vec is pre-1.0,
# hence the upper bound; without it (or where Python cannot load SQLite
# extensions, e.g. macOS system Python) search falls back to numpy. The model
# itself is a separate, explicit download: openfoia docs embed-model.
semantic = ["model2vec>=0.4.0,<1", "sqlite-vec>=0.1.6,<0.2"]
# MCP server (openfoia mcp serve, stdio only). The low-level
# Server(on_list_tools=..., on_call_tool=...) API it uses is the mcp 2.x one.
mcp = ["mcp>=2.0,<3"]
# Everything
all = [
    "openfoia[ocr,fax,mail,cloud-ai,ner,ner-multilingual,tor,browser,email-files,encryption,semantic,mcp]",
]
# Development
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # tests/test_plugin.py parses plugin frontmatter. Test-only -- keep it out
    # of core deps.
    "pyyaml>=6.0",
    # Image metadata stripping is tested for real, not only the no-Pillow path.
    "pillow>=10.0.0",
]

[project.scripts]
openfoia = "openfoia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set is pinned explicitly, never inherited from ruff's defaults:
# CI installs an unpinned `ruff>=0.1.0`, so relying on defaults lets a new
# ruff release silently change what CI enforces (which is exactly how this
# repo went from green to 325 errors on unchanged code).
#
# Widen this list deliberately, and fix the findings — do not narrow it to
# make a build pass.
select = [
    "E4", "E7", "E9",  # pycodestyle (the historical default subset)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "DTZ",             # naive datetimes — caught a real deadline bug
    "C4",              # comprehensions
    "PIE",
    "RUF",
]

ignore = [
    # `class X(str, Enum)` -> `StrEnum` changes what `str(X.MEMBER)` returns
    # ("federal" instead of "AgencyLevel.FEDERAL"). These enums are persisted
    # through SQLAlchemy and serialized into API responses and exports, so
    # that is a data-format change wearing a lint fix's clothing. Worth doing
    # deliberately with migration checks, not as part of a lint sweep.
    "UP042",
]

# Not enabled yet, tracked as follow-up:
#   BLE001 (~82) — blind `except Exception`. High signal for this codebase:
#     a swallowed exception is what made a failed records lookup report as a
#     clean result. Fixing it needs a per-site audit of error handling, which
#     is its own reviewable change rather than a bulk sweep.
#   S (bandit) — mostly subprocess/randomness false positives here, plus
#     S101 which is just "asserts in tests".

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `arg = Depends(...)` in the
# signature default; B008 flags every route.
"openfoia/server.py" = ["B008"]
# Typer's CLI idiom is the same: `arg: T = typer.Option(...)`.
"openfoia/cli.py" = ["B008"]
# Tests legitimately use `assert`, private access, and broad `raises`.
"tests/*" = ["S101", "SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
